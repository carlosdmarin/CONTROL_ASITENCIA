# Perfil de desarrollo local HTTP para PractiQR.
# No colocar secretos reales en este archivo.

# Desarrollo local HTTP necesita Secure=false para que el navegador acepte Set-Cookie.
jwt.cookie.secure=false

# SQL detallado solamente para depuración local explícita.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.asistencia.attendance_system=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
