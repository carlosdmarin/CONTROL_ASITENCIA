# Perfil de producción HTTPS para PractiQR.
# No colocar secretos reales en este archivo.
# Activar con SPRING_PROFILES_ACTIVE=prod y configurar las variables externas requeridas.

# Producción HTTPS necesita obligatoriamente Secure=true.
jwt.cookie.secure=true

# Producción no debe exponer SQL ni parámetros vinculados.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.com.asistencia.attendance_system=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Producción necesita una allowlist explícita, sin comodines permanentes.
CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
